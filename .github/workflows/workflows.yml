name: Trigger on pull and merge when tests pass

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Java 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'

      - name: Run Maven Tests
        run: mvn clean test

  docker:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t swagger-api-tests .

      - name: Run Docker Container
        run: docker run --rm swagger-api-tests
